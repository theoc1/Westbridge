name: westbridge-stand

services:
  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    image: westbridge/asterisk:20-noble
    container_name: westbridge-asterisk
    restart: unless-stopped
    ports:
      # AMI, the only interface Westbridge uses. Loopback only: the secret in
      # manager.conf is committed to this repository, and manager.conf permits
      # every RFC 1918 range, so publishing this on 0.0.0.0 hands call
      # origination to anyone on the same Wi-Fi.
      - "127.0.0.1:5038:5038/tcp"
      - "5060:5060/udp"        # SIP signalling for the softphones
      - "10000-10100:10000-10100/udp"  # RTP
    volumes:
      # Only the files this stand actually defines are overlaid; asterisk.conf,
      # modules.conf and logger.conf stay as the distro shipped them.
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/confbridge.conf:/etc/asterisk/confbridge.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
