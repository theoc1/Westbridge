; Two softphone endpoints for manual testing: 1001 and 1002.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Uncomment and set to the address your softphone sees (your host's LAN IP)
; if SIP works but audio does not. Media through Docker's NAT on macOS is
; unreliable by design; the roster only needs signalling.
;external_media_address = 192.168.1.10
;external_signaling_address = 192.168.1.10
;local_net = 172.16.0.0/12

[endpoint-defaults](!)
type = endpoint
context = internal
disallow = all
allow = ulaw
allow = alaw
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes

[auth-defaults](!)
type = auth
auth_type = userpass

[aor-defaults](!)
type = aor
max_contacts = 1
remove_existing = yes

[1001](endpoint-defaults)
auth = 1001
aors = 1001
callerid = Alice <1001>

[1001](auth-defaults)
username = 1001
password = 1001-secret

[1001](aor-defaults)

[1002](endpoint-defaults)
auth = 1002
aors = 1002
callerid = Bob <1002>

[1002](auth-defaults)
username = 1002
password = 1002-secret

[1002](aor-defaults)
