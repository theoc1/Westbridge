; Two softphone endpoints for manual testing: 1001 and 1002.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Clients on this computer reach Docker through its published loopback ports.
; For phones on another device, set BOTH addresses to the host's LAN IP and
; use that same IP as the SIP server. Transport changes require a restart.
external_media_address = 127.0.0.1
external_signaling_address = 127.0.0.1
external_signaling_port = 5060
; Only the container network is internal, not the host/softphone network.
; Adjust this if Docker uses a subnet outside 172.16.0.0/12.
local_net = 172.16.0.0/12

[endpoint-defaults](!)
type = endpoint
context = internal
disallow = all
allow = ulaw
allow = alaw
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
; Recover abandoned calls when a client disappears without delivering BYE.
rtp_timeout = 60
rtp_timeout_hold = 300

[auth-defaults](!)
type = auth
auth_type = userpass

[aor-defaults](!)
type = aor
max_contacts = 1
remove_existing = yes

[1001](endpoint-defaults)
auth = 1001
aors = 1001
callerid = Alice <1001>

[1001](auth-defaults)
username = 1001
password = 1001-secret

[1001](aor-defaults)

[1002](endpoint-defaults)
auth = 1002
aors = 1002
callerid = Bob <1002>

[1002](auth-defaults)
username = 1002
password = 1002-secret

[1002](aor-defaults)
