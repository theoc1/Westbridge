[general]
static = yes
writeprotect = yes

[globals]
CONF_ROOM = 1000

; Where the softphone endpoints land (pjsip.conf: context = internal).
[internal]
exten => 1000,1,NoOp(Joining ConfBridge ${CONF_ROOM})
 same => n,Answer()
 same => n,ConfBridge(1000)
 same => n,Hangup()

; Straight extension-to-extension dialling, handy for sanity-checking that a
; softphone is registered at all.
exten => _100[12],1,NoOp(Direct call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; WB_ORIGINATE_CONTEXT. Westbridge originates Local/<number>@conference-out
; with Application: ConfBridge, so this half only has to reach the callee; the
; other half of the Local channel joins the room.
[conference-out]
exten => _X.,1,NoOp(Westbridge invite for ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Westbridge accepts a single leading "+" (see conference.NormalizeNumber), and
; "_X." matches digits only, so an E.164 number needs a pattern of its own or
; the Originate fails with "extension not found" and the UI reports a queued
; invite that never dials.
exten => _+X.,1,NoOp(Westbridge invite for ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN:1},30)
 same => n,Hangup()
