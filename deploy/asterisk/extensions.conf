[general]
static = yes
writeprotect = yes

[globals]
; This version advertises the admission/group-count deletion contract.
WB_ROOM_CONTRACT = 1

[internal]
; Conference range 100-9999. The more specific SIP endpoint pattern wins.
exten => _[1-9]XX,1,Goto(westbridge-join,${EXTEN},1)
exten => _[1-9]XXX,1,Goto(westbridge-join,${EXTEN},1)
exten => _100[12],1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

[westbridge-join]
exten => _X.,1,Set(WB_TARGET=${DB(westbridge-rooms/${EXTEN})})
 same => n,GotoIf($["${WB_TARGET}" = ""]?reject)
 ; Count BEFORE the final gate check. After DBDel a channel either appears in
 ; GROUP_COUNT or fails that check; there is no invisible admitted join window.
 same => n,Set(GROUP(westbridge)=${WB_TARGET})
 same => n,GotoIf($["${DB(westbridge-rooms/${EXTEN})}" != "${WB_TARGET}"]?reject)
 same => n,GotoIf($["${WB_BRIDGE}" != "" & "${WB_BRIDGE}" != "${WB_TARGET}"]?reject)
 same => n,Answer()
 same => n,ConfBridge(${WB_TARGET})
 same => n(reject),Hangup()

[conference-out]
; Both formats go through a gate before Dial; the answer-side Local channel
; passes westbridge-join again before ConfBridge. /n preserves both identities.
exten => _X.,1,Gosub(westbridge-dial,s,1(${EXTEN}))
 same => n,Hangup()
exten => _+X.,1,Gosub(westbridge-dial,s,1(${EXTEN:1}))
 same => n,Hangup()

[westbridge-dial]
exten => s,1,GotoIf($["${WB_BRIDGE}" = ""]?reject)
 same => n,Set(GROUP(westbridge)=${WB_BRIDGE})
 same => n,GotoIf($["${DB(westbridge-rooms/${WB_ROOM_NUMBER})}" != "${WB_BRIDGE}"]?reject)
 same => n,Dial(PJSIP/${ARG1},30)
 same => n,Return()
 same => n(reject),Hangup()
