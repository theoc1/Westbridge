; Profiles for the single MVP room.

[general]

[default_bridge]
type = bridge
max_members = 20
internal_sample_rate = auto
mixing_interval = 20
video_mode = none

[default_user]
type = user
admin = no
marked = no
; No name recording prompt: it would sit between the caller and the roster on
; every single manual test.
announce_join_leave = no
announce_user_count = yes
; The default music class has no media installed in this image.
music_on_hold_when_empty = no
quiet = no
