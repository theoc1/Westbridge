; AMI — the one and only interface Westbridge uses.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
; AMI over HTTP is not needed: Westbridge speaks raw AMI over TCP, and
; Asterisk has no AMI-over-WebSocket transport at all (see the project README).
webenabled = no
displayconnects = no
timestampevents = no

[westbridge]
secret = westbridge-secret
deny = 0.0.0.0/0.0.0.0
; Loopback plus the RFC1918 ranges Docker hands out. A published port makes the
; backend look like it connects from the bridge gateway (172.x on Linux and
; Docker Desktop, 192.168.65.x on the Desktop VM), never from 127.0.0.1.
permit = 127.0.0.1/255.255.255.255
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
;
; Permission classes, checked against the Asterisk sources:
;   ConfbridgeList  -> EVENT_FLAG_REPORTING  (write: reporting; AMI actions check write permissions)
;   ConfbridgeKick  -> EVENT_FLAG_CALL       (read/write: call)
;   Originate       -> EVENT_FLAG_ORIGINATE  (write: originate)
;   ConfbridgeJoin/Leave/Start/End events are class "call" (read: call)
; Originate with an Application only needs "system" when the application is
; blacklisted (agi, exec, system, ...); ConfBridge is not, so "system" here is
; headroom, not a requirement.
read = system,call,reporting
write = system,call,originate,reporting
